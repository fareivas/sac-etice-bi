AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: API mínima do protótipo SAC ETICE BI

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 10
    MemorySize: 128

Resources:
  FiscalFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../
      Handler: services/api/src/domains/fiscal/handler.handler
      Environment:
        Variables:
          NODE_ENV: production
          LOCAL_FISCAL_DASHBOARD_ENABLED: 'false'
          LOCAL_FISCAL_USER_ID: ''
          LOCAL_FISCAL_CAN_ACCESS_VIEW: 'false'
          SAC_DB_HOST: ''
          SAC_DB_PORT: ''
          SAC_DB_NAME: ''
          SAC_DB_USER: ''
          SAC_DB_PASSWORD: ''
          SAC_DB_SSL: 'false'
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /api/v1/fiscais/me/dashboard/resumo
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - services/api/src/domains/fiscal/handler.ts
        Target: es2022
        Format: cjs

  GerenteContratosFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../
      Handler: services/api/src/domains/gerente-contratos/handler.handler
      Environment:
        Variables:
          NODE_ENV: production
          LOCAL_MANAGER_DASHBOARD_ENABLED: 'false'
          LOCAL_MANAGER_USER_ID: ''
          LOCAL_MANAGER_CAN_ACCESS_VIEW: 'false'
          SAC_DB_HOST: ''
          SAC_DB_PORT: ''
          SAC_DB_NAME: ''
          SAC_DB_USER: ''
          SAC_DB_PASSWORD: ''
          SAC_DB_SSL: 'false'
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /api/v1/gerentes-contrato/me/dashboard/resumo
            Method: GET
        FiscalLoad:
          Type: HttpApi
          Properties:
            Path: /api/v1/gerentes-contrato/me/fiscais/carga
            Method: GET
        SuppliersSummary:
          Type: HttpApi
          Properties:
            Path: /api/v1/gestao-contratual/fornecedores/resumo
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - services/api/src/domains/gerente-contratos/handler.ts
        Target: es2022
        Format: cjs

  DiretoriaTecnicaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../
      Handler: services/api/src/domains/diretoria-tecnica/handler.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /api/diretoria-tecnica
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - services/api/src/domains/diretoria-tecnica/handler.ts
        Target: es2022
        Format: cjs

  DiretoriaComercialFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../
      Handler: services/api/src/domains/diretoria-comercial/handler.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /api/diretoria-comercial
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - services/api/src/domains/diretoria-comercial/handler.ts
        Target: es2022
        Format: cjs

  GerenteContasFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../
      Handler: services/api/src/domains/gerente-contas/handler.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /api/gerente-contas
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - services/api/src/domains/gerente-contas/handler.ts
        Target: es2022
        Format: cjs
