<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ETICE • Dashboard do Fiscal • React</title>
<style>
:root{--bg:#f3f6fa;--card:#fff;--text:#142033;--muted:#64748b;--line:#dbe3ef;--primary:#164e63;--primary2:#0f766e;--green:#16a34a;--yellow:#eab308;--red:#dc2626;--blue:#2563eb;--shadow:0 8px 24px rgba(15,23,42,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}
.header{position:sticky;top:0;z-index:20;background:linear-gradient(120deg,#0f172a,#164e63);color:#fff;padding:18px 24px;box-shadow:0 4px 14px rgba(0,0,0,.16)}
.header-inner{max-width:1500px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:16px}.brand h1{font-size:22px;margin:0}.brand p{font-size:12px;color:#d7eef3;margin:5px 0 0}
.header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.source{padding:7px 11px;border-radius:999px;font-size:11px;font-weight:800;border:1px solid rgba(255,255,255,.22)}.source.api{background:#166534}.source.fake{background:#92400e}.source.loading{background:#1e40af}
.btn{border:0;border-radius:8px;padding:8px 11px;cursor:pointer;font-weight:700;font-size:12px}.btn.light{background:#fff;color:#164e63}.btn.primary{background:#0f766e;color:#fff}.btn:disabled{opacity:.55;cursor:wait}
.page{max-width:1500px;margin:auto;padding:18px}.connection{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:13px;display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:14px}.connection input{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px}.connection .hint{grid-column:1/-1;font-size:11px;color:var(--muted)}
.filters{display:grid;grid-template-columns:1fr 1fr 1fr 1.6fr;gap:10px;margin-bottom:14px}.filters select,.filters input{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;background:#fff}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:14px}.saldo-kpis{grid-template-columns:repeat(4,1fr)}.kpi{background:#fff;padding:15px;border-radius:14px;box-shadow:var(--shadow);border-top:4px solid var(--primary)}.kpi small{display:block;color:var(--muted);font-size:11px;margin-bottom:6px}.kpi strong{font-size:22px}.kpi span{display:block;color:var(--muted);font-size:11px;margin-top:5px}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin-bottom:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}.card{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:16px;overflow:hidden}.card h2{font-size:16px;margin:0 0 4px}.card h3{font-size:13px;margin:0}.sub{font-size:11px;color:var(--muted);margin:0 0 12px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;min-width:820px}th,td{text-align:left;padding:10px 9px;border-bottom:1px solid var(--line);font-size:12px;vertical-align:top}th{background:#f8fafc;color:#475569;position:sticky;top:0}tr:hover td{background:#f8fbfd}
.tag{display:inline-block;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:800;white-space:nowrap}.green{background:#dcfce7;color:#166534}.yellow{background:#fef3c7;color:#92400e}.red{background:#fee2e2;color:#991b1b}.blue{background:#dbeafe;color:#1e40af}.gray{background:#e2e8f0;color:#334155}
.alert{border-left:5px solid var(--red);background:#fff7f7;padding:11px 13px;border-radius:10px;margin-top:10px;font-size:12px}.alert.yellowbox{border-color:#d97706;background:#fffbeb}.alert.bluebox{border-color:#2563eb;background:#eff6ff}.action{color:#0f766e;font-weight:800}
.chart{width:100%;height:275px}.chart-sm{height:230px}.chart-legend{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}.saldo-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}.saldo-legend{display:flex;gap:7px;flex-wrap:wrap}
.progress{height:9px;background:#e2e8f0;border-radius:99px;overflow:hidden;min-width:130px}.progress span{height:100%;display:block}.money{white-space:nowrap;font-variant-numeric:tabular-nums}.pct{font-weight:900;margin-top:4px;display:block}
.flow{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;overflow:auto}.phase{border:1px solid var(--line);background:#f8fafc;border-radius:10px;padding:10px}.phase b{font-size:11px;display:block}.phase strong{display:block;font-size:14px;margin:7px 0}.phase span{font-size:10px;color:var(--muted)}
.empty{text-align:center;padding:28px;color:var(--muted)}.error{color:#991b1b}.footer{text-align:center;color:var(--muted);font-size:10px;padding:20px}.schema{margin-top:10px}.schema summary{cursor:pointer;font-size:11px;color:#0f766e;font-weight:700}.schema pre{white-space:pre-wrap;background:#0f172a;color:#dbeafe;padding:12px;border-radius:9px;font-size:10px;overflow:auto;max-height:280px}
@media(max-width:1150px){.kpis,.saldo-kpis{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}}
@media(max-width:650px){.header{position:static}.header-inner{align-items:flex-start;flex-direction:column}.page{padding:11px}.kpis,.saldo-kpis{grid-template-columns:1fr 1fr}.filters,.connection{grid-template-columns:1fr}.connection .hint{grid-column:1}.kpi strong{font-size:18px}}
</style>
</head>
